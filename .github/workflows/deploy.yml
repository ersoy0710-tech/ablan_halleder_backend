name: Ablan Halleder Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 1. Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: 🧹 2. Gereksiz Dosyaları Temizle
        run: rm -rf .git

      - name: 📤 3. Dosyaları Azure'a Aktar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          password: ${{ secrets.AZURE_PASSWORD }}
          source: "." 
          target: "/home/${{ secrets.AZURE_USERNAME }}/ablan_halleder_backend"

      - name: ⚙️ 4. Azure'da Docker İşlemlerini Başlat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            cd /home/${{ secrets.AZURE_USERNAME }}/ablan_halleder_backend
            
            echo "🛠️ Azure: Yeni kodlarla imaj derleniyor..."
            docker build -t ablan-halleder-backend:latest .
            
            echo "🛑 Azure: Eski konteyner durduruluyor ve siliniyor..."
            docker stop ablan-halleder-backend-container || true
            docker rm ablan-halleder-backend-container || true
            
            echo "🚀 Azure: Yeni konteyner ayağa kaldırılıyor..."
            docker run -d \
                --name ablan-halleder-backend-container \
                --network host \
                --restart always \
                ablan-halleder-backend:latest
                
            echo "🧹 Azure: Temizlik yapılıyor..."
            docker image prune -f