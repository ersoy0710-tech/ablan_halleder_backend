name: Ablan Halleder Backend Deploy

# Hangi durumlarda çalışacağını belirliyoruz
on:
  push:
    branches:
      - main # Eğer ana dalının adı 'master' ise burayı master olarak değiştir.

jobs:
  deploy:
    runs-on: ubuntu-latest # GitHub Actions'ın çalışacağı sanal makine

    steps:
      # 1. Aşama: GitHub sunucusuna projenin en güncel kodlarını çeker
      - name: 🚚 1. Kodları Çek (Checkout)
        uses: actions/checkout@v4

      # 2. Aşama: Şifre kullanarak dosyaları Azure'a kopyalar (scp mantığı)
      - name: 📤 2. Dosyaları Azure'a Aktar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          password: ${{ secrets.AZURE_PASSWORD }}
          source: "." # Tüm klasörü al
          target: "/home/${{ secrets.AZURE_USERNAME }}/ablan_halleder"
          exclude: "node_modules,.git,.env" # Azure'a gitmesine gerek olmayanlar

      # 3. Aşama: Şifre kullanarak Azure'a bağlanır ve Docker komutlarını çalıştırır
      - name: ⚙️ 3. Azure'da Docker İşlemlerini Başlat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            # Hedef klasöre git
            cd /home/${{ secrets.AZURE_USERNAME }}/ablan_halleder
            
            echo "🛠️ Azure: Yeni kodlarla imaj derleniyor..."
            sudo docker build -t ablan_halleder_backend:latest .
            
            echo "🛑 Azure: Eski konteyner durduruluyor ve siliniyor..."
            sudo docker stop ablan-halleder-backend-container || true
            sudo docker rm ablan-halleder-backend-container || true
            
            echo "🚀 Azure: Yeni konteyner ayağa kaldırılıyor..."
            sudo docker run -d \
                --name ablan-halleder-backend-container \
                --network host \
                --restart always \
                ablan-halleder-backend:latest
                
            echo "🧹 Azure: Temizlik yapılıyor..."
            sudo docker image prune -f