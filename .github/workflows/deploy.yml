name: Ablan Halleder Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 1. Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 2. Node.js Ortamını Hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 3. Bağımlılıkları Kur (npm ci)
        run: npm install

      - name: 🔑 3.5. Test İçin Sahte PEM Dosyaları Oluştur
        run: |
          mkdir -p src/key
          openssl genrsa -out src/key/private.pem 2048
          openssl rsa -in src/key/private.pem -pubout -out src/key/public.pem

      - name: 🧪 4. Testleri Çalıştır (npm test)
        run: npm test
        env:
          PORT: 3000
          JWT_EXPIRES: "1w"

      - name: 🛡️ 5. Güvenlik Taraması (npm audit)
        run: npm audit --audit-level=high

      - name: 🧹 6. Gereksiz Dosyaları Temizle
        run: rm -rf .git node_modules src/key

      - name: 📤 7. Dosyaları Azure'a Aktar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          password: ${{ secrets.AZURE_PASSWORD }}
          source: "." 
          target: "/home/${{ secrets.AZURE_USERNAME }}/ablan_halleder_backend"

      - name: ⚙️ 8. Azure'da Docker İşlemlerini Başlat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            cd /home/${{ secrets.AZURE_USERNAME }}/ablan_halleder_backend
            
            echo "🛠️ Azure: Yeni kodlarla imaj derleniyor..."
            docker build -t ablan-halleder-backend:latest .
            
            echo "🛑 Azure: Eski konteyner durduruluyor ve siliniyor..."
            docker stop ablan-halleder-backend-container || true
            docker rm ablan-halleder-backend-container || true
            
            echo "🚀 Azure: Yeni konteyner ayağa kaldırılıyor..."
            docker run -d \
                --name ablan-halleder-backend-container \
                --network host \
                --restart always \
                -v /home/${{ secrets.AZURE_USERNAME }}/ablan_halleder_backend/src/uploads:/app/src/uploads \
                ablan-halleder-backend:latest
                
            echo "🧹 Azure: Temizlik yapılıyor..."
            docker image prune -f
